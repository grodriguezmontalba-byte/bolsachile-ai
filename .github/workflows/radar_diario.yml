name: BolsaChile radar diario virtual
on:
  workflow_dispatch:
  schedule:
    - cron: '30 23 * * 1-5'
permissions:
  contents: write
concurrency:
  group: bolsachile-radar
  cancel-in-progress: false
jobs:
  analizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias
        run: python -m pip install 'yfinance>=0.2.50,<2' 'pandas>=2.2,<3' 'numpy>=1.26,<3'
      - name: Ejecutar análisis y simulación
        run: python scripts/radar_diario.py
      - name: Guardar resultados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/market.json data/portfolio.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar radar y cartera virtual V1.2'
            git push
          fi
